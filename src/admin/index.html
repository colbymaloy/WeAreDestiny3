<!doctype html>
<html lang="en">
<head>
<!--INCLUDE:head.html
  TITLE=Review queue — WE ARE DESTINY 3
  OG_TITLE=Review queue
  DESCRIPTION=Moderation for WE ARE DESTINY 3.
  PATH=/admin/
-->
<meta name="robots" content="noindex, nofollow">
</head>

<body>
<!--INCLUDE:topbar.html
  NAV=
-->

<main class="page" id="main">
  <div class="page-head">
    <p class="eyebrow"><span class="mark"></span>Moderation</p>
    <h1 class="page-title">Review<br>queue</h1>
    <p class="lede" id="lede">Checking your access&hellip;</p>
  </div>

  <section class="auth" id="signin" hidden>
    <div class="auth-card">
      <h2 class="auth-title">Sign in</h2>
      <p>Only accounts on the admin list can review submissions.</p>
      <div class="auth-actions">
        <button type="button" class="btn btn-primary" id="sign-in">Continue with Google</button>
      </div>
    </div>
  </section>

  <section class="auth" id="denied" hidden>
    <div class="auth-card">
      <h2 class="auth-title">Not an admin</h2>
      <p>This account isn't on the allowlist. Your Firebase user ID is
         <code id="uid"></code> — add a document with that ID to the
         <code>admins</code> collection in Firestore to grant access.</p>
      <div class="auth-actions">
        <button type="button" class="btn btn-ghost" id="sign-out">Sign out</button>
      </div>
    </div>
  </section>

  <div id="queue" hidden>
    <div class="repeat" id="pending"></div>
    <div class="problems" id="problems" hidden></div>
  </div>
</main>

<!--INCLUDE:footer.html-->

<script src="/assets/admin.js?v=7" type="module"></script>
</body>
</html>
