name: Check

# The site deploys from Firebase, not from here. This just keeps the shared
# renderer and static shell from breaking on a pull request.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the static shell
        run: node .github/scripts/build.mjs

      - name: Preflight
        run: node .github/scripts/preflight.mjs
