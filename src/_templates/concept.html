<!doctype html>
<html lang="en">
<head>
<!--INCLUDE:head.html
  TITLE={{TITLE}} — WE ARE DESTINY 3
  OG_TITLE={{TITLE}}
  DESCRIPTION={{DESCRIPTION}}
  PATH={{PATH}}
  IMAGE={{IMAGE}}
-->
</head>

<body>
<a class="skip" href="#idea">Skip to the idea</a>

<!--INCLUDE:topbar.html-->

<main class="concept">
  <div class="concept-head">
    <div class="concept-tags">
      <p class="eyebrow">{{CATEGORIES}}</p>
      <span class="status status-{{STATUS}}">{{STATUS_LABEL}}</span>
    </div>
    <h1 class="concept-title">{{TITLE}}</h1>
    <p class="concept-by">{{BYLINE}}</p>
  </div>

  <!-- 1. Selected direction — the closest representation of the idea -->
  {{HERO}}

  <!-- 2. The idea -->
  <section class="section section-tight" id="idea" aria-labelledby="idea-title">
    <div class="section-head">
      <h2 class="section-title" id="idea-title"><span class="mark"></span>The idea</h2>
    </div>
    <div class="idea">
      <p class="idea-body">{{SUMMARY}}</p>
      <div>{{SIDEBAR}}</div>
    </div>
  </section>

  <!-- 3. Key takeaways — what this concept is arguing for -->
  {{TAKEAWAYS}}

  <!-- 4. Selected moments — the seconds worth keeping, wherever they came from -->
  {{MOMENTS}}

  <!-- 5. Explorations — evidence under the idea, not entries of their own -->
  {{EXPLORATIONS}}
</main>

<dialog class="lb" id="lightbox" aria-labelledby="lb-title">
  <div class="lb-layout">
    <div class="lb-stage" id="lb-stage">
      <button class="lb-close" id="lb-close" type="button" aria-label="Close">&#10005;</button>
    </div>
    <div class="lb-bar">
      <h2 id="lb-title"></h2>
      <p id="lb-sub"></p>
    </div>
  </div>
</dialog>

<!--INCLUDE:footer.html-->

<script src="/assets/concept.js" type="module"></script>
</body>
</html>
